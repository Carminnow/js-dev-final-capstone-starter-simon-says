<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/styles.css" />
    <title>Carmino Says</title>
  </head>
  <body>
    <main>
      <!-- Audio controls: always visible, so players can change them mid-game -->
      <section class="audio-controls">
        <button class="audio-toggle js-music-toggle" aria-pressed="true">Music: On</button>
        <button class="audio-toggle js-sound-toggle" aria-pressed="true">Sounds: On</button>
      </section>
      <!--Added the missing information in the h1 heading -->
      <h1 class="js-heading">Carmino Says</h1>

      <section class="game-controls">
        <!--Added the start button -->
         <button class="start-button js-start-button">Start</button>
        <select class="level-select js-level-select">
          <option value = "1"> Level 1 (8 Rounds)</option>
          <option value = "2"> Level 2 (14 Rounds)</option>
          <option value = "3"> Level 3 (20 Rounds)</option>
          <option value = "4"> Level 4 (31 Rounds)</option>
        </select>
         <span class="howto js-instructions">
          <button class="howto-button" aria-describedby="howto-panel">?</button>
          <span class="howto-panel" id="howto-panel" role="tooltip">
            <strong>How to play</strong>
            <span>1. Pick a level, then press Start.</span>
            <span>2. Watch and listen as the computer lights up the pads.</span>
            <span>3. Repeat the sequence by clicking the pads in order.</span>
            <span>4. Each round adds one pad. One wrong press ends the game.</span>
            <em>Levels: 1 = 8 rounds, 2 = 14, 3 = 20, 4 = 31</em>
          </span>
        </span>
        <span class="status hidden js-status"></span>
      </section>

      <section class="pad-container unclickable js-pad-container">
        <div class="pad pad-red js-pad-red" data-color="red"></div>
        <!--Added the missing pads -->
        <div class="pad pad-green js-pad-green" data-color="green"></div>
        <div class="pad pad-blue js-pad-blue" data-color="blue"></div>
        <div class="pad pad-yellow js-pad-yellow" data-color="yellow"></div>
      </section>
    </main>
    <script src="./src/index.js"></script>
  </body>
</html>
